# Monitor (auto-detect is usually fine)
# monitor=,preferred,auto,1.57
# monitor = DP-1, 1920x1080@60, 1.57
# monitor = eDP-1, preferred, 1080x0, 1.57
monitor = eDP-1, 2256x1504@60, 0x0, 1.57

# Startup
exec-once = qs -c noctalia-shell
exec-once = systemctl --user start hyprpolkitagent
#exec-once = hyprpaper
# env = XDG_MENU_PREFIX,arch-

# Default Apps
$terminal = kitty
$browser = firefox
$filemanager = dolphin
$code = code
$monitor = kitty --class btop -e btop

# App keybinds
bind = SUPER, Q, exec, $terminal
bind = SUPER, D, exec, $browser
bind = SUPER SHIFT, D, exec, $browser --private-window
bind = SUPER, E, exec, $filemanager
bind = SUPER, A, exec, $code
bind = SUPER, S, exec, $monitor
bind = SUPER, X, togglefloating
bind = SUPER, W, killactive
bind = SUPER SHIFT, W, forcekillactive
bind = SUPER, M, exit

bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, fullscreen, 0 

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# hi i was here, move windows with mainMod + shift + arrow keys
bind = SUPER SHIFT, left, moveWindow, l
bind = SUPER SHIFT, right, moveWindow, r
bind = SUPER SHIFT, up, moveWindow, u
bind = SUPER SHIFT, down, moveWindow, d

# VIM keys
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
# more VIM keys
bind = SUPER SHIFT, H, moveWindow, l
bind = SUPER SHIFT, L, moveWindow, r
bind = SUPER SHIFT, K, moveWindow, u
bind = SUPER SHIFT, J, moveWindow, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
#bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
#bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Noctalia Shell keybinds
$ipc = qs -c noctalia-shell ipc call

bind = SUPER, TAB, exec, $ipc launcher toggle
bind = SUPER, comma, exec, $ipc controlCenter toggle
# bind = SUPER, S, exec, $ipc settings toggle
bind = SUPER, V, exec, $ipc plugin:clipboard toggle
bind = SUPER, delete, exec, $ipc sessionMenu toggle
bind = SUPER SHIFT, delete, exec, shutdown now
bind = SUPER, escape, exec, $ipc sessionMenu lock
bind = SUPER SHIFT, escape, exec, $ipc sessionMenu lockAndSuspend

# settings keybind
bind = , XF86AudioMedia, exec, $ipc settings toggle

# media keybinds
bind = , XF86AudioPlay, exec, $ipc media playPause
bind = , XF86AudioNext, exec, $ipc media next
bind = , XF86AudioPrev, exec, $ipc media previous
bind = SUPER, XF86AudioPlay, exec, $ipc media toggle
# audio keybinds
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
# brightness keybinds
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# keybind cheatsheet
bind = SUPER, Y, exec, $ipc plugin:keybind-cheatsheet toggle

# Grimblast Screenshot
bind = , Print, exec, grimblast --freeze --notify copysave area ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# call script to toggle layout (per workspace)
bind = SUPER, I, exec, ~/.config/hypr/scripts/toggle-layout.sh dwindle
bind = SUPER, O, exec, ~/.config/hypr/scripts/toggle-layout.sh master
bind = SUPER, P, exec, ~/.config/hypr/scripts/toggle-layout.sh scrolling

# drag and resize windows with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

gesture = 3, horizontal, workspace
gesture = 2, pinchIn, cursorZoom, 2
gesture = 2, pinchOut, cursorZoom, 1

# btop from bind spawns with special rules
windowrule {
    name = btop-float
    match:class = ^btop$

    float = on
    size = 1200 600
    center = on
}
windowrule = match:class ^kitty$, opacity 0.9 0.8

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(89b4faee) rgba(f38ba8ee) 45deg
    #col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 3

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.7

    # dim_inactive = true
    # dim_strength = 0.25

    # shadow {
        # enabled = false
        # range = 4
        # render_power = 3
        # color = rgba(1a1a1aee)
    # }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.3
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true

    enable_swallow = true
    swallow_regex = ^(kitty)$
}
source = /home/mattseq/.config/hypr/noctalia/noctalia-colors.conf

